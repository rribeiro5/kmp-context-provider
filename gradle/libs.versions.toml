[versions]

lib-version = "1.0.0"

android-compileSdk = "37"
android-minSdk = "23"

detekt = "2.0.0-alpha.6"
startup = "1.2.0"
robolectric = "4.18"
mockk = "1.14.12"
androidx-test-core = "1.7.0"
androidx-test-runner = "1.7.0"
androidx-appcompat = "1.8.0"
androidx-activity = "1.13.0"
kover = "0.9.11"
dokka = "2.3.0"

kotlin = "2.4.21"
agp = "9.5.3"
maven-publish = "0.37.0"

[libraries]

startup = { module = "androidx.startup:startup-runtime", version.ref = "startup" }

detekt-formatting = { module = "dev.detekt:detekt-rules-ktlint-wrapper", version.ref = "detekt" }

test-robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
test-mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
test-androidx-core = { module = "androidx.test:core-ktx", version.ref = "androidx-test-core" }
test-androidx-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }

sample-androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidx-appcompat" }
sample-androidx-activity = { module = "androidx.activity:activity-ktx", version.ref = "androidx-activity" }

[plugins]

kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "maven-publish" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }

android-app = { id = "com.android.application", version.ref = "agp" }

